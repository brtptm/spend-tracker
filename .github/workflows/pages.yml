# Publishes the pitch deck (demo/slides.html) to GitHub Pages as the site index.
name: Deploy slides to Pages

on:
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        # The deck is self-contained (inline favicon, CDN scripts), so it only needs its screenshots.
        run: |
          mkdir _site
          cp -r demo/assets _site/assets
          cp demo/slides.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
